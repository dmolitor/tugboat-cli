[project]
name = "tugboat-cli"
version = "0.1.1"
description = "Quickly containerize your Python and R (or hybrid) projects with minimal configuration. Simple utilities to generate a Dockerfile from an analysis directory, build the corresponding Docker image, push the image to DockerHub, and publicly share the project via Binder."
readme = "README.md"
authors = [
    { name = "Daniel Molitor", email = "molitdj97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "tugboat-py>=0.1.3",
]

[project.scripts]
tugboat = "tugboat_cli:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
]
